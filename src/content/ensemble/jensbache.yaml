name: "Jens Bache"
rolle: "Schauspieler"
bio: "Jens Bache absolvierte seine Schauspiel-Ausbildung an der Theaterakademie Sachsen (Leipzig/Delitzsch) und verbrachte im Anschluss sein Praxissemester auf der Felsenbühne Rathen. Im Anschluss führten ihn Engagements an die Landesbühnen Sachsen, dem Stadttheater Bremerhaven, der städtischen Bühne Lahnstein und zur Müritz-Saga."
