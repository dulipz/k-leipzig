name: "Thomas Büchel"
rolle: "Schauspieler"
bio: "Thomas Büchel studierte an der Theaterhochschule Hans Otto in Leipzig. Engagements am Neuen Theater Halle, dem Deutsche Schauspielhaus Hamburg, dem Schauspiel Leipzig. Schauspielhaus Bochum, DNT Weimar. Gastengagements in Wiesbaden, Leipzig, Zürich, Bonn, Rostock und Düsseldorf, Staatstheater Meiningen, Staatstheater Karlsruhe. Die letzten 10 Jahre Engagement in Essen. Thomas Büchel war Schauspieldozent an den Hochschulen Hamburg, Leipzig, Weimar, Essen und Halle. Thomas lebt jetzt freiberuflich mit seiner Familie in Halle."
