name: "Justine Rockstroh"
rolle: "Schauspielerin"
bio: "wurde in Werdau geboren und absolvierte 2022 ihr Schauspiel-Studium an der Filmschauspielschule Berlin. Ihr erstes Engagement nach dem Studium erhielt die aufgeweckte Schauspielerin am Theater Plauen/Zwickau im Stück „Die Kuh Rosmarie“. Danach folgten diverse Produktionen am Reutlinger Theater „Die Tonne“. Weitere Erfahrungen sammelte Justine Rockstroh in Ludwigsburg, speziell in Performance - Art. Bei der Komödie Leipzig ist sie nun erstmalig als Jaqueline Struutz in „Go Trabi Go“ zu sehen."
