name: "Anja Dorrer"
rolle: "Schauspielerin"
bio: "studierte in Graz Schauspiel. Nach dem Studium zog es Anja nach Deutschland, wo sie in zahlreichen Theaterstücken auf Tournee zu sehen war. 2017 heuerte sie als Schauspielerin auf der „Mein Schiff“ Flotte an. Seit 2020 arbeitet sie erfolgreich als Synchronschauspielerin und Sprecherin in Berlin."
