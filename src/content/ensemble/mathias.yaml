name: "Mathias Engel"
rolle: "Geschäftsführer\nSchauspieler"
bio: "studierte an der Theaterhochschule „Hans Otto“ in Leipzig. Nach seinem Studium folgten Engagements am „neuen theater“ Halle und dem Theater Altenburg/Gera. Seit 2002 ist Mathias Engel freischaffend für Bühne, Film und Fernsehen tätig. Von 2009 – 2013 spielte er bei den Karl-May-Spielen in Bad Segeberg. Im Sommer 2014 war er bei den Störtebeker Festspielen auf Rügen in Ralswiek zu sehen."
