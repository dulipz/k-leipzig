name: "Karsten Engelhardt"
rolle: "Schauspieler"
bio: "lebt als freischaffender Schauspieler und Regisseur in Hamburg. Seit seiner Schauspielausbildung in Kiel arbeitete er an vielen Bühnen im gesamten deutschsprachigen Raum und spielte auch in mehreren TV-Produktionen.\nSeiner ersten Regiearbeit im Jahr 2003 folgten bis heute knapp 50 weitere Inszenierungen an Theatern u.a. in Hamburg, Hof, Ravensburg, Karlsruhe, Lübeck, Bremen, Kassel und Bielefeld.\nLieblingsrolle: Michael Minetti in dem Stück „Sechs Tanzstunden in sechs Wochen“.\nwww.karsten-engelhardt.com"
