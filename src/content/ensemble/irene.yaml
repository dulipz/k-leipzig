name: "Irene Holzfurtner"
rolle: "Geschäftsführerin\nSchauspielerin"
bio: "studierte an der Schule der darstellenden Künste Berlin. Ihr erstes Engagement hatte sie am Stadttheater Zwickau. Danach spielte sie an mehreren Berliner Bühnen u.a. an der Volksbühne. Nach mehrjähriger Tourneetätigkeit in Deutschland, Österreich und der Schweiz ist sie freischaffend im Bereich Bühne, Film und Fernsehen."
