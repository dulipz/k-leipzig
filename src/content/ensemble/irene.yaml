name: "Irene Holzfurtner"
rolle: "Geschäftsführerin\nSchauspielerin"
bio: "studierte an der Schule der darstellenden Künste Berlin. Ihr erstes Engagement hatte sie am Stadttheater Zwickau. Es folgten Engagements an verschiedenen Berliner Bühnen u. a. an der Volksbühne. Nach mehrjähriger Tourneetätigkeit als Schauspielerin in Deutschland, Österreich und der Schweiz arbeitete sie freischaffend im Bereich Bühne, Film und Fernsehen. Seit 2013 ist sie Geschäftsführerin, Schauspielerin, Regisseurin und Autorin der Komödie Leipzig sowie seit 2026 auch der Kleinen Komödie Reuden."
