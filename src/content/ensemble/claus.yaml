name: "Claus Großer"
rolle: "Fechtmeister\nKampfchoreograph"
bio: "studierte Sportwissenschaften an der Deutschen Hochschule für Körperkultur und Sport in Leipzig. Nach seinem Abschluss unterrichtete er die Schauspielstudenten in den Fächern Akrobatik, Bewegung und Bühnenfechten an der Hochschule für Musik und Theater „Felix Mendelssohn Bartholdy“ in Leipzig. In seiner langjährigen Tätigkeit in der Theaterpraxis arbeitete er an ca. 150 Inszenierungen mit und choreographierte vorwiegend im Schauspiel Fecht- und Kampfszenen, aber auch für das Ballett, die Oper und für Musical. Er leitet die Ausbildung im Bereich Bühnenfechten an der Akademie der Fechtkunst Deutschlands und ist seit 2009 Fechtmeister."
