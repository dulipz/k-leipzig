name: "Mario Grünewald"
rolle: "Schauspieler"
bio: "studierte als gebürtiger Merseburger an der Hochschule für Musik und Theater Leipzig. Es folgte ein fast 15 jähriges Engagement am Staatsschauspiel Dresden. Anschließend zog es ihn an die Landesbühnen Sachsen. Seit 2014 ist Mario freier Schauspieler und Regisseur an der „Herkuleskeule“ Dresden, dem „Theaterkahn“ Dresden und dem „Kleine Welt Theater“ Radebeul. Mario lebt mit seiner Familie in Freital."
