name: "Emmy Pilawa"
rolle: "Schauspielerin"
bio: "Wurde 2000 in Hamburg geboren und absolvierte 2023 ihre Ausbildung an der Schule für Schauspiel Hamburg und ist seitdem freiberuflich als Schauspielerin tätig. Während ihrer Ausbildung spielte sie bei verschiedenen TV-Produktionen mit, unter anderem bei „Helen Dorn“. Ende 2022 spielte sie außerdem die Hauptrolle in einem Spielfilm, der in Costa Rica gedreht wurde."
