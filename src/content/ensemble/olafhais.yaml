name: "Olaf Hais"
rolle: "Schauspieler"
bio: "Nach seinem Schauspielstudium an der Filmhochschule Konrad Wolf in Potsdam-Babelsberg ging Olaf Hais an die Landesbühnen Sachsen, wo er u.a. 11 Jahre auf der Felsenbühne Rathen als Winnetou zu sehen war. Anschließend gastierte er u.a. an der Comödie Dresden, am Theaterkahn, am Staatsschauspiel Dresden, am Theater Zittau oder bei den Freilichtspielen Schwäbisch Hall. Zudem arbeitete er regelmäßig als Schauspieldozent an der Hochschule für Musik und Theater in Leipzig und gab u.a. für das sächsische Bildungsministerium Kurse für Körpersprache und Rhetorik. Während seines Schauspielengagements am Deutsch-Sorbischen Volkstheater Bautzen begann er, sehr erfolgreich Regie zu führen. Aktuell hat er gerade die Regie der Boulevardkomödie „Anderthalb Stunden zu spät“ am Hoftheater Dresden mit Peter Kube und Cornelia Kaupert abgeschlossen."
