<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid — generous, breathing, lobby-like" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-6); }
  .row { display:flex; align-items:flex-end; gap:var(--space-4); flex-wrap:wrap; }
  .item { text-align:center; }
  .bar { background:var(--gold-400); border-radius:var(--radius-xs); width:28px; }
  .t { margin-top:6px; font-size:10px; color:var(--ink-500); font-weight:600; }
  .t b { display:block; color:var(--text-strong); font-size:11px; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="t"><b>1</b>4</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="t"><b>2</b>8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="t"><b>3</b>12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="t"><b>4</b>16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="t"><b>5</b>24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="t"><b>6</b>32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="t"><b>7</b>40</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="t"><b>8</b>48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="t"><b>9</b>64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="t"><b>10</b>80</div></div>
  </div>
</body></html>
