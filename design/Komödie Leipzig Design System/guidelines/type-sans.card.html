<!-- @dsCard group="Type" viewport="700x240" name="Sans · Bricolage Grotesque" subtitle="The functional voice — UI, body, labels, buttons" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-6); color:var(--text-body); }
  .lbl { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-400); font-weight:700; margin-bottom:12px; }
  .weights { display:flex; flex-wrap:wrap; gap:18px; font-size:24px; margin-bottom:14px; color:var(--text-strong); }
  .lead { font-size:17px; line-height:1.6; max-width:62ch; }
  .glyphs { font-size:15px; color:var(--ink-500); margin-top:12px; }
</style></head>
<body>
  <div class="lbl">Bricolage Grotesque · 300 – 800</div>
  <div class="weights">
    <span style="font-weight:300">Light</span>
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
    <span style="font-weight:800">Black</span>
  </div>
  <p class="lead">Liebe Gäste, wir eröffnen unsere erste feste Spielstätte — einen kleinen Theatersaal mit Platz für rund 90 Gäste. Wir freuen uns auf Ihren Besuch.</p>
  <div class="glyphs">AÄÖÜ aäöüß 0123456789 · 24,50 € · 19:30 Uhr · &amp; ? !</div>
</body></html>
