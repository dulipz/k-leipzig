<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-6); }
  .grid { display:flex; gap:var(--space-6); flex-wrap:wrap; }
  .col { display:flex; gap:var(--space-4); }
  .box { width:70px; height:70px; background:var(--surface-raised); border:1px solid var(--border-default); display:flex; align-items:flex-end; justify-content:center; }
  .sh { width:80px; height:70px; background:#fff; border-radius:var(--radius-md); }
  .t { font-size:10px; color:var(--ink-500); font-weight:700; text-align:center; margin-top:6px; }
  .sep { width:1px; background:var(--border-default); }
</style></head>
<body>
  <div class="grid">
    <div>
      <div class="col">
        <div><div class="box" style="border-radius:var(--radius-sm)"></div><div class="t">sm 6</div></div>
        <div><div class="box" style="border-radius:var(--radius-md)"></div><div class="t">md 10</div></div>
        <div><div class="box" style="border-radius:var(--radius-lg)"></div><div class="t">lg 16</div></div>
        <div><div class="box" style="border-radius:var(--radius-pill)"></div><div class="t">pill</div></div>
      </div>
    </div>
    <div class="sep"></div>
    <div>
      <div class="col">
        <div><div class="sh" style="box-shadow:var(--shadow-sm)"></div><div class="t">sm</div></div>
        <div><div class="sh" style="box-shadow:var(--shadow-md)"></div><div class="t">md</div></div>
        <div><div class="sh" style="box-shadow:var(--shadow-lg)"></div><div class="t">lg</div></div>
        <div><div class="sh" style="box-shadow:var(--shadow-glow)"></div><div class="t">glow</div></div>
      </div>
    </div>
  </div>
</body></html>
