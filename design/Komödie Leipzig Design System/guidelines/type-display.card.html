<!-- @dsCard group="Type" viewport="700x240" name="Display · Lo-Type" subtitle="The playbill voice — Louis Oppenheim, 1914 · self-hosted brand font" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-6); color:var(--text-strong); }
  .big { font-family:var(--font-display); font-weight:400; font-size:60px; line-height:1; letter-spacing:.03em; text-transform:uppercase; margin:0; }
  .sub { font-family:var(--font-display); font-weight:400; font-size:32px; color:var(--plum-500); margin:12px 0 0; }
  .glyphs { font-family:var(--font-display); font-weight:400; font-size:26px; color:var(--ink-600); margin-top:14px; letter-spacing:.03em; }
  .lbl { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-400); font-weight:700; margin-bottom:10px; }
</style></head>
<body>
  <div class="lbl">Lo-Type · Regular 400 · single weight — drive scale with size, never faux-bold</div>
  <p class="big">Komödie Leipzig</p>
  <p class="sub">Bei uns lachen Sie besser</p>
  <div class="glyphs">AÄ BÖ CÜ · Go Trabi Go &amp; 1234567890 — 24,50 € · 19:30 Uhr ?!</div>
</body></html>
