<!-- @dsCard group="Colors" viewport="700x150" name="Warm Neutrals" subtitle="Ink → parchment — every neutral is warm-tinted, never grey" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-5); }
  .scale { display:grid; grid-template-columns:repeat(12,1fr); gap:5px; }
  .sw { height:64px; border-radius:var(--radius-sm); box-shadow:var(--shadow-xs); border:1px solid var(--border-subtle); }
  .meta { margin-top:6px; font-size:9px; line-height:1.3; color:var(--ink-600); }
  .meta b { display:block; color:var(--text-strong); font-size:10px; }
</style></head>
<body>
  <div class="scale">
    <div><div class="sw" style="background:var(--ink-950)"></div><div class="meta"><b>950</b>#15100E</div></div>
    <div><div class="sw" style="background:var(--ink-900)"></div><div class="meta"><b>900</b>#1E1816</div></div>
    <div><div class="sw" style="background:var(--ink-800)"></div><div class="meta"><b>800</b>#2A2320</div></div>
    <div><div class="sw" style="background:var(--ink-700)"></div><div class="meta"><b>700</b>#3B322D</div></div>
    <div><div class="sw" style="background:var(--ink-600)"></div><div class="meta"><b>600</b>#574B43</div></div>
    <div><div class="sw" style="background:var(--ink-500)"></div><div class="meta"><b>500</b>#786A60</div></div>
    <div><div class="sw" style="background:var(--ink-400)"></div><div class="meta"><b>400</b>#9E8E82</div></div>
    <div><div class="sw" style="background:var(--ink-300)"></div><div class="meta"><b>300</b>#C3B4A7</div></div>
    <div><div class="sw" style="background:var(--ink-200)"></div><div class="meta"><b>200</b>#DFD2C4</div></div>
    <div><div class="sw" style="background:var(--ink-100)"></div><div class="meta"><b>100</b>#EFE7DA</div></div>
    <div><div class="sw" style="background:var(--ink-50)"></div><div class="meta"><b>50</b>#F8F1E6</div></div>
    <div><div class="sw" style="background:var(--parchment)"></div><div class="meta"><b>paper</b>#FDF8EF</div></div>
  </div>
</body></html>
