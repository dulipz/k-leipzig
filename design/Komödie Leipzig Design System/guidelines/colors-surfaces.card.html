<!-- @dsCard group="Colors" viewport="700x210" name="Two Surface Contexts" subtitle="Light playbill (default) vs dark stage (heroes, footers)" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); }
  .split { display:grid; grid-template-columns:1fr 1fr; min-height:210px; }
  .pane { padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-3); justify-content:center; }
  .playbill { background:var(--surface-page); }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
  h3 { margin:0; font-family:var(--font-display); font-size:28px; }
  p { margin:0; font-size:13px; line-height:1.5; }
  .chip { display:inline-block; padding:3px 10px; border-radius:999px; font-size:10px; font-weight:700; }
</style></head>
<body>
  <div class="split">
    <div class="pane playbill">
      <span class="eyebrow" style="color:var(--gold-600)">Playbill · light</span>
      <h3 style="color:var(--text-strong)">Bei uns lachen Sie besser</h3>
      <p style="color:var(--text-body)">Default content surface. Parchment page, white cards, warm ink text. Gold for links &amp; CTAs.</p>
      <div><span class="chip" style="background:var(--gold-500);color:var(--ink-950)">CTA</span></div>
    </div>
    <div class="pane kl-stage">
      <span class="eyebrow" style="color:var(--gold-400)">Stage · dark</span>
      <h3 style="color:var(--text-stage-strong)">Vorhang auf!</h3>
      <p style="color:var(--text-stage-body)">Heroes, marquees, footers. Footlight glow rising from below, champagne text, gold accents.</p>
      <div><span class="chip" style="background:var(--gold-500);color:var(--ink-950)">CTA</span></div>
    </div>
  </div>
</body></html>
