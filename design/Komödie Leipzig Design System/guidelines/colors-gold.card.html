<!-- @dsCard group="Colors" viewport="700x150" name="Bühnengold · Primary" subtitle="Stage-gold amber — the footlight, the laugh, every CTA" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-5); }
  .scale { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .sw { height:64px; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:6px; box-shadow:var(--shadow-xs); }
  .meta { margin-top:6px; font-size:10px; line-height:1.35; color:var(--ink-600); }
  .meta b { display:block; color:var(--text-strong); font-size:11px; }
  .ring { outline:2px solid var(--ink-950); outline-offset:2px; }
</style></head>
<body>
  <div class="scale">
    <div><div class="sw" style="background:var(--gold-50)"></div><div class="meta"><b>50</b>#FCF4E6</div></div>
    <div><div class="sw" style="background:var(--gold-100)"></div><div class="meta"><b>100</b>#FBE9CB</div></div>
    <div><div class="sw" style="background:var(--gold-200)"></div><div class="meta"><b>200</b>#F8D596</div></div>
    <div><div class="sw" style="background:var(--gold-300)"></div><div class="meta"><b>300</b>#F4BE63</div></div>
    <div><div class="sw" style="background:var(--gold-400)"></div><div class="meta"><b>400</b>#EFA63B</div></div>
    <div><div class="sw ring" style="background:var(--gold-500)"></div><div class="meta"><b>500 ◆</b>#E2841C</div></div>
    <div><div class="sw" style="background:var(--gold-600)"></div><div class="meta"><b>600</b>#C16C12</div></div>
    <div><div class="sw" style="background:var(--gold-700)"></div><div class="meta"><b>700</b>#9A540F</div></div>
    <div><div class="sw" style="background:var(--gold-800)"></div><div class="meta"><b>800</b>#6F3D0F</div></div>
    <div><div class="sw" style="background:var(--gold-900)"></div><div class="meta"><b>900</b>#4A2A0E</div></div>
  </div>
</body></html>
