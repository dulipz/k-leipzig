<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); }
  .stage { min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-3); padding:var(--space-7); }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-400); }
  h2 { font-family:var(--font-display); font-weight:400; font-size:44px; margin:0; color:var(--text-stage-strong); letter-spacing:.02em; }
  p { margin:0; font-size:13px; color:var(--text-stage-muted); }
</style></head>
<body>
  <div class="stage kl-stage">
    <span class="eyebrow">Das Original · Dinnertheater</span>
    <h2>Vorhang auf!</h2>
    <p>radial gold glow from below + plum wash from the corner, over ink-950</p>
  </div>
</body></html>
