<!-- @dsCard group="Colors" viewport="700x150" name="Vorhang · Secondary" subtitle="Curtain aubergine/plum — velvet, dark stages, accents" -->
<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:var(--space-5); }
  .scale { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .sw { height:64px; border-radius:var(--radius-sm); box-shadow:var(--shadow-xs); }
  .meta { margin-top:6px; font-size:10px; line-height:1.35; color:var(--ink-600); }
  .meta b { display:block; color:var(--text-strong); font-size:11px; }
  .ring { outline:2px solid var(--ink-950); outline-offset:2px; }
</style></head>
<body>
  <div class="scale">
    <div><div class="sw" style="background:var(--plum-50)"></div><div class="meta"><b>50</b>#F7EEF3</div></div>
    <div><div class="sw" style="background:var(--plum-100)"></div><div class="meta"><b>100</b>#ECD6E2</div></div>
    <div><div class="sw" style="background:var(--plum-200)"></div><div class="meta"><b>200</b>#D8AEC6</div></div>
    <div><div class="sw" style="background:var(--plum-300)"></div><div class="meta"><b>300</b>#BE82A4</div></div>
    <div><div class="sw" style="background:var(--plum-400)"></div><div class="meta"><b>400</b>#9E5980</div></div>
    <div><div class="sw ring" style="background:var(--plum-500)"></div><div class="meta"><b>500 ◆</b>#7C3A60</div></div>
    <div><div class="sw" style="background:var(--plum-600)"></div><div class="meta"><b>600</b>#642E4D</div></div>
    <div><div class="sw" style="background:var(--plum-700)"></div><div class="meta"><b>700</b>#4C2540</div></div>
    <div><div class="sw" style="background:var(--plum-800)"></div><div class="meta"><b>800</b>#341A2D</div></div>
    <div><div class="sw" style="background:var(--plum-900)"></div><div class="meta"><b>900</b>#20101C</div></div>
  </div>
</body></html>
