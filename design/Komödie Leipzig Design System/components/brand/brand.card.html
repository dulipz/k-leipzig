<!-- @dsCard group="Brand" viewport="700x520" name="Logo · Wordmark & Monogram" subtitle="Redesigned lockup — the Ö becomes footlights" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: var(--space-7) var(--space-6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); min-height: 220px; }
  .light { background: var(--surface-page); }
  .dark  { color: var(--text-stage-body); }
  .lbl { font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; font-weight: 700; opacity: 0.6; }
  .marks { display: flex; align-items: center; gap: var(--space-6); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell dark kl-stage">
    <span class="lbl">Stacked · on stage</span>
    <div id="a"></div>
  </div>
  <div class="cell light">
    <span class="lbl">Horizontal · on playbill</span>
    <div id="b"></div>
  </div>
  <div class="cell dark kl-stage">
    <span class="lbl">Wordmark only</span>
    <div id="c"></div>
  </div>
  <div class="cell light">
    <span class="lbl">Monogram · gold / ink / mono</span>
    <div class="marks" id="d"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js?v=2"></script>
<script type="text/babel">
  const { Wordmark, Monogram } = window.KomDieLeipzigDesignSystem_ce970b;
  const R = ReactDOM.createRoot.bind(ReactDOM);
  R(document.getElementById("a")).render(<Wordmark layout="stacked" tone="gold" tagline />);
  R(document.getElementById("b")).render(<Wordmark layout="horizontal" tone="ink" />);
  R(document.getElementById("c")).render(<Wordmark layout="wordmark-only" tone="gold" size="sm" />);
  R(document.getElementById("d")).render(<><Monogram size={56} tone="gold" /><Monogram size={56} tone="ink" /><span style={{color:"var(--plum-500)"}}><Monogram size={56} tone="mono" /></span></>);
</script>
</body>
</html>
