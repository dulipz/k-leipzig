<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--surface-page); padding: 28px; }
  .sec { margin-bottom: 28px; }
  .sec h4 { font-family: var(--font-sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-400); margin: 0 0 12px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
  .stage { background: var(--ink-950); border-radius: 16px; padding: 20px; }
  svg.lucide { width: 18px; height: 18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:start; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
async function loadComp(path) {
  let code = await (await fetch(path)).text();
  code = code.replace(/import[^;]*;/g, "");
  code = code.replace(/export\s+function\s+(\w+)/g, "window.$1 = function $1");
  (0, eval)(Babel.transform(code, { presets: ["react"] }).code);
}
window.addEventListener("load", async () => {
  for (const p of [
    "components/brand/Monogram.jsx","components/brand/Wordmark.jsx",
    "components/core/Badge.jsx","components/core/Button.jsx","components/core/IconButton.jsx",
    "components/forms/Input.jsx","components/forms/Select.jsx","components/cards/ShowCard.jsx",
  ]) await loadComp(p);
  const code = await (await fetch("__demo.jsx")).text();
  (0, eval)(Babel.transform(code, { presets: ["react"] }).code);
});
</script>
<script>window.__DEMO_SRC = true;</script>
<script id="demo-src" type="text/plain"></script>
</body>
</html>
