<!-- @dsCard group="Website" viewport="1280x780" name="Marketing Website" subtitle="Interactive click-through — Home · Spielplan · Inszenierung · Tickets" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Komödie Leipzig</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  svg.kl-ic { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -0.15em; }
  button { font-family: var(--font-sans); }
  * { scrollbar-width: thin; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>

<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="SpielplanScreen.jsx"></script>
<script type="text/babel" src="ShowDetailScreen.jsx"></script>
<script type="text/babel" src="TicketsScreen.jsx"></script>

<script type="text/babel" data-presets="react">
  function ContactScreen({ onNavigate }) {
    const Ic = window.Ic; const v = window.KL_DATA.venue; window.useLucide();
    return (
      <main style={{ background: "var(--surface-page)", minHeight: "60vh" }}>
        <section className="kl-stage" style={{ padding: "var(--space-9) var(--gutter)" }}>
          <div style={{ maxWidth: "var(--container-max)", margin: "0 auto", textAlign: "center" }}>
            <span style={{ fontSize: "var(--text-xs)", fontWeight: 700, letterSpacing: "var(--tracking-caps)", textTransform: "uppercase", color: "var(--gold-400)" }}>Kontakt & Anfahrt</span>
            <h1 style={{ fontFamily: "var(--font-display)", fontWeight: 400, fontSize: "var(--text-5xl)", margin: "var(--space-2) 0 0", color: "var(--text-stage-strong)" }}>So finden Sie uns</h1>
          </div>
        </section>
        <div style={{ maxWidth: "640px", margin: "0 auto", padding: "var(--space-9) var(--gutter)", display: "flex", flexDirection: "column", gap: "var(--space-5)", textAlign: "center", alignItems: "center" }}>
          <p style={{ fontSize: "var(--text-lg)", color: "var(--text-body)", lineHeight: "var(--leading-relaxed)", margin: 0 }}>
            Liebe Gäste, wir freuen uns auf Ihren Besuch in unserer neuen Spielstätte, der {v.name}.
          </p>
          <div style={{ display: "flex", gap: "var(--space-3)", alignItems: "center", color: "var(--text-strong)", fontSize: "var(--text-lg)" }}>
            <span style={{ color: "var(--gold-600)", fontSize: "22px" }}><Ic n="map-pin" /></span>{v.address}
          </div>
          <div style={{ display: "flex", gap: "var(--space-3)", alignItems: "center", color: "var(--text-strong)", fontSize: "var(--text-lg)" }}>
            <span style={{ color: "var(--gold-600)", fontSize: "22px" }}><Ic n="mail" /></span>{v.email}
          </div>
        </div>
      </main>
    );
  }

  function App() {
    const [route, setRoute] = React.useState("home");
    const [showId, setShowId] = React.useState(window.KL_DATA.current[0].id);
    const navigate = (r) => { setRoute(r); window.scrollTo({ top: 0, behavior: "auto" }); };
    const openShow = (id) => { setShowId(id); navigate("show"); };

    let screen;
    if (route === "spielplan") screen = <window.SpielplanScreen onOpenShow={openShow} />;
    else if (route === "show") screen = <window.ShowDetailScreen showId={showId} onNavigate={navigate} />;
    else if (route === "tickets") screen = <window.TicketsScreen onNavigate={navigate} />;
    else if (route === "kontakt") screen = <ContactScreen onNavigate={navigate} />;
    else screen = <window.HomeScreen onNavigate={navigate} onOpenShow={openShow} />;

    return (
      <React.Fragment>
        <window.SiteHeader route={route} onNavigate={navigate} />
        {screen}
        <window.SiteFooter onNavigate={navigate} />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
